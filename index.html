<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#f3f3e9">
<title>神树 · 稳稳扎根</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap');
:root{--ink:#34493a;--muted:#879181;--accent:#5c7658;--paper:#f6f5ee;--line:#dce1d3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,a,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b89b68;outline-offset:4px}header{height:96px;max-width:1250px;margin:auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;font-size:34px}.brand span{font:23px 'Noto Serif SC',serif}.brand small{display:block;font:9px sans-serif;letter-spacing:4px;margin-top:7px}nav{display:flex;gap:35px}nav button{padding:12px 4px;color:var(--muted)}nav button.active{color:var(--ink);box-shadow:0 2px var(--accent)}#sound{color:var(--muted)}main{max-width:1180px;margin:auto;padding:48px 40px 36px;min-height:calc(100vh - 176px)}.eyebrow{font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}h1,h2,h3{font-family:'Noto Serif SC','Songti SC',serif;font-weight:500}h1{font-size:36px;letter-spacing:3px;margin:10px 0}h2{font-size:25px}p{color:var(--muted)}.intro{text-align:center}.intro p{margin:8px 0 28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.seed-card{padding:0 20px 24px;border:1px solid var(--line);border-radius:140px 140px 16px 16px;background:#eeefdf;transition:transform .25s,border-color .25s;position:relative;overflow:hidden}.seed-card:nth-child(2){background:#e8eddf}.seed-card:nth-child(3){background:#e4eaec}.seed-card.selected{border:2px solid var(--accent);transform:translateY(-5px)}.seed-card svg{width:100%;height:245px;display:block}.seed-card h3{font-size:21px;margin:0}.seed-card p{font-size:12px;margin:7px 0}.seed{display:inline-block;padding:5px 13px;background:#ffffff80;border-radius:20px;font-size:11px}.pick-action{text-align:center;margin-top:28px}.primary{background:var(--accent);color:white;border-radius:28px;padding:13px 32px;min-width:170px;box-shadow:0 6px 16px #405c3912}.primary:hover{background:#466141}.subtle{font-size:12px;color:var(--muted);padding:9px 15px}.garden-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:70px;align-items:center}.garden{text-align:center;position:relative}.garden svg{width:100%;height:390px;overflow:visible}.pill{border:1px solid var(--line);border-radius:20px;display:inline-block;padding:4px 15px;font-size:11px;color:var(--muted)}.garden h1{font-size:31px}.garden .caption{font-family:'Noto Serif SC',serif;font-size:15px;letter-spacing:2px;margin:0}.panel{background:#ffffff8c;border:1px solid #e2e5d9;border-radius:22px;padding:30px}.panel h2{margin:8px 0 16px}.panel p{font-size:13px}.task{font-family:'Noto Serif SC',serif;font-size:20px;line-height:1.8;margin:22px 0}.panel .primary{width:100%;margin-top:12px}.panel label{display:block;font-size:12px;margin:14px 0 8px;color:var(--muted)}textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);background:#fafaf5;resize:vertical}textarea{min-height:115px}.progress-head{display:flex;justify-content:space-between;font-size:12px}.progress{height:5px;background:#e5e8dc;border-radius:6px;margin:12px 0 22px}.progress i{display:block;background:#8da47c;height:100%;border-radius:6px}.stages{display:flex;justify-content:space-between;margin:30px auto 8px;max-width:460px;font-size:10px;color:#9aA190}.stages span:before{content:'';display:block;width:7px;height:7px;background:#d9dece;border-radius:50%;margin:0 auto 8px}.stages span.on{color:#506b47}.stages span.on:before{background:#708c5d}.preview{margin:32px auto 0;border-top:1px solid var(--line);padding:18px 0;max-width:820px}.preview summary{cursor:pointer;color:var(--muted);font-size:12px;text-align:center}.preview-controls{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:15px;flex-wrap:wrap}.preview-controls button{padding:5px 12px;border:1px solid var(--line);border-radius:20px}.preview-controls button.on{background:#dfe6d8}.preview input{accent-color:#6c855d;width:220px}.demo-label{color:#ab8460;font-size:12px;margin:8px}.entries{max-width:720px;margin:25px auto}.entry{border-bottom:1px solid var(--line);padding:20px 0}.entry small{color:var(--muted)}.entry h3{margin:8px 0;font-size:18px}.entry p{white-space:pre-wrap;color:var(--ink)}.entry-actions{margin-top:10px}.entry.editing{background:#ffffff8c;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}.empty{text-align:center;padding:60px 0}.grove-card{border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px}.grove-card svg{width:170px;height:140px;float:left}footer{max-width:1180px;margin:auto;padding:22px 40px;display:flex;justify-content:space-between;border-top:1px solid var(--line);font-size:10px;color:var(--muted);gap:15px}footer button{text-decoration:underline;font-size:10px}dialog{border:1px solid var(--line);border-radius:20px;max-width:550px;width:90%;padding:30px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#21352655;backdrop-filter:blur(4px)}dialog .close{float:right;font-size:24px}.leaf-new{transform-box:fill-box;transform-origin:center;animation:unfold 1.1s ease-out}.watering svg{filter:drop-shadow(0 0 15px #d7dba0)}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#34493a;color:white;padding:12px 25px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.show{opacity:1}@keyframes unfold{from{opacity:0;scale:.1}to{opacity:1;scale:1}}@media(max-width:760px){header{padding:0 20px;height:80px}nav{gap:15px}#sound span{display:none}main{padding:28px 20px}.cards{gap:10px}.seed-card{padding:0 8px 15px;border-radius:75px 75px 14px 14px}.seed-card svg{height:160px}.seed-card h3{font-size:16px}.seed-card p{font-size:10px}.seed{font-size:9px;padding:4px 7px}h1{font-size:29px}.garden-layout{grid-template-columns:1fr;gap:25px}.garden svg{height:300px}.garden h1{font-size:28px}.panel{padding:23px}.stages{margin-top:20px}footer{padding:20px;flex-direction:column;align-items:center}.intro p{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
@media(max-width:540px){header{padding:0 16px}.brand{gap:6px;font-size:25px}.brand span{font-size:19px}.brand small{font-size:8px;letter-spacing:2px}nav{gap:13px;white-space:nowrap;font-size:12px}.cards{grid-template-columns:1fr;gap:14px}.seed-card{border-radius:20px;display:grid;grid-template-columns:44% 56%;text-align:left;padding:10px 15px;align-content:center}.seed-card svg{grid-row:1/4;height:160px;margin:-10px 0}.seed-card .seed{justify-self:start;align-self:end;font-size:10px}.seed-card h3{font-size:22px;white-space:nowrap;margin:6px 0 0}.seed-card p{font-size:12px;margin-top:1px}.seed-card.selected{transform:none}.pick-action{margin-top:22px}.intro h1{font-size:26px}.eyebrow{letter-spacing:2px}.garden svg{height:280px}}

</style>
</head>
<body>
<header>
<a class="brand" href="#">♧ <span>神树<small>稳 稳 扎 根</small></span></a>
<nav>
<button id="home" class="active">我的树</button>
<button id="notes">拾言</button>
<button id="groves">我的树林</button>
</nav>
<button id="sound" aria-label="开启声音">♫ <span>声音关</span></button>
</header>
<main id="app"></main>
<footer>
<span>一点一点写感受，慢慢长成自己的样子。</span>
<span>无需登录 · 记录仅保存在当前浏览器 <button id="backup">备份</button><button id="restore">恢复</button><br>记录只保存在你自己的手机浏览器里 · 可备份</span>
</footer>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'), KEY='shenshu-web-v2', KEY_V1='shenshu-web-v1';
const themes=[{name:'春日花庭',seed:'花核',tag:'把温柔，种进日常',leaf:['#94ae72','#b1c784'],flower:'#efb4b0',ground:'#a6b67b',sky:'#f1e9d8',quote:'你留给自己的温柔，终于开了花。'},{name:'晴光草地',seed:'橡果',tag:'慢慢来，也在长大',leaf:['#62955c','#92b16a'],ground:'#a9bd75',sky:'#e4edd8',quote:'每一点小小的坚持，都长成了庇护自己的树荫。'},{name:'月光湖畔',seed:'月滴种子',tag:'在安静里，积攒力量',leaf:['#6b9d98','#a2c8b4'],ground:'#8ca9a0',sky:'#dfe8eb',quote:'那些安静生长的日子，也有自己的光。'}];
const tasks=['到窗边站一会，看看今天的天空。','给自己倒一杯水，慢慢喝完。','整理一个很小的角落。','散步五分钟，留意一片叶子。','写下今天值得感谢的一件小事。','放下手机，安静坐三分钟。','给今天的自己一句鼓励。','听一首喜欢的歌。','伸展肩膀，做三次深呼吸。','做一件一直想做的小事。','认真吃一顿饭。','记下今天让你微笑的瞬间。','给一位想念的人问声好。','把一件不着急的事留给明天。','回看这半个月的一点变化。','给自己留十分钟空白。','看看远处，让眼睛休息。','读一小段喜欢的文字。','完成一件可以两分钟做完的事。','写下最近学会的一件事。','收好一件陪伴你的物品。','留意今天的一种声音。','允许自己把一件事做得不完美。','用心感受阳光或风。','对自己说一句谢谢。','做一次舒适的伸展。','记下现在最想珍惜的东西。','为明天准备一件小事。','回看第一次写下的话。','写一句话，送给这30天的自己。'];
let state={tree:null,groves:[]}, selected=0, screen='home', demo=null, editing=false, editNote=-1, sound=false, fresh=false;

function loadState(){
  try{const v2=JSON.parse(localStorage.getItem(KEY));if(v2&&Array.isArray(v2.groves))return v2}catch(e){}
  try{
    const v1=JSON.parse(localStorage.getItem(KEY_V1));
    if(v1&&Array.isArray(v1.groves)){
      try{localStorage.setItem(KEY,JSON.stringify(v1))}catch(e){}
      return v1;
    }
  }catch(e){}
  return {tree:null,groves:[]};
}
state=loadState();

const day=()=>new Date().toLocaleDateString('sv-SE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('保存失败，请先导出备份，检查浏览器存储空间。');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function chime(){if(!sound)return;const a=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,a.currentTime+i*.12);g.gain.linearRampToValueAtTime(.08,a.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+1.2);o.start(a.currentTime+i*.12);o.stop(a.currentTime+i*.12+1.3)});setTimeout(()=>a.close(),2000)}
function treeSvg(t,n,id='tree',animate=false){const c=themes[t],p=n/30,stage=Math.ceil(n/5),s=.25+p*.75;let leaves='',branches='';
for(let i=0;i<n;i++){const a=i*2.39996,r=Math.sqrt((i+1)/30),x=250+Math.cos(a)*128*r*(t===2?.85:1),y=186+Math.sin(a)*91*r+(t===2?Math.abs(Math.cos(a))*25:0);branches+=`<path d="M250 315 Q${245+(x-250)*.15} ${y+30} ${x} ${y}" fill="none" stroke="#876445" stroke-width="${3+(1-r)*5}" stroke-linecap="round"/>`;leaves+=`<g ${animate&&i===n-1?'class="leaf-new"':''}><ellipse cx="${x}" cy="${y}" rx="${t===2?17:30}" ry="${t===2?40:22}" transform="rotate(${t===2?(x<250?25:-25):Math.cos(a)*45} ${x} ${y})" fill="url(#${id}leaf)"/><path d="M${x-10} ${y+7}q10 -6 20 -13" stroke="#ffffff35" fill="none" stroke-width="1.5"/></g>`;if(t===0&&n>20&&i%3===0)leaves+=flower(x,y,9+(n-20)*.5,c.flower);if(t===2&&n>24&&i%3===0)leaves+=`<circle cx="${x}" cy="${y+28}" r="2" fill="#f9f2ba"/>`}
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430" role="img" aria-label="${c.name}，已长出${n}片叶子"><defs><radialGradient id="${id}glow"><stop stop-color="${c.sky}"/><stop offset="1" stop-color="${c.sky}" stop-opacity="0"/></radialGradient><linearGradient id="${id}soil" x2="0" y2="1"><stop stop-color="${c.ground}"/><stop offset="1" stop-color="#65795b"/></linearGradient><linearGradient id="${id}leaf" x2=".8" y2="1"><stop stop-color="${c.leaf[1]}"/><stop offset="1" stop-color="${c.leaf[0]}"/></linearGradient><linearGradient id="${id}bark"><stop stop-color="#ad865c"/><stop offset=".5" stop-color="#c19a6b"/><stop offset="1" stop-color="#866343"/></linearGradient></defs><circle cx="250" cy="216" r="195" fill="url(#${id}glow)"/>${t===2?'<circle cx="361" cy="77" r="23" fill="#ffffed" opacity=".85"/>':''}<ellipse cx="250" cy="376" rx="154" ry="20" fill="#3f553e" opacity=".07"/><path d="M83 333 Q89 391 250 393 Q411 391 417 333Z" fill="url(#${id}soil)"/><ellipse cx="250" cy="330" rx="167" ry="49" fill="${c.ground}"/><ellipse cx="244" cy="337" rx="100" ry="23" fill="#405737" opacity=".12"/>${t===2?'<ellipse cx="340" cy="344" rx="57" ry="20" fill="#bfdbd8"/><path d="M310 345h47m-27 7h38" stroke="#eef6ed" opacity=".7"/>':''}${[0,1,2,3,4,5].map(i=>`<ellipse cx="${105+i*55}" cy="${325+Math.sin(i*2)*20}" rx="${8+i%3*5}" ry="${5+i%3*3}" fill="${i%2?'#d6d8bc':'#819460'}"/>`).join('')}${n===0?`<ellipse cx="250" cy="327" rx="18" ry="12" fill="${t===0?'#daa59e':t===1?'#98704b':'#99bcb8'}"/><path d="M246 318l6 9-3 6" stroke="#fff7df" fill="none"/>`:`<g transform="translate(${250*(1-s)} ${332*(1-s)}) scale(${s})"><path d="M228 334 Q245 295 243 202 Q248 189 256 203 Q258 293 277 336 Q255 345 228 334" fill="url(#${id}bark)"/>${branches}${leaves}<path d="M249 315q-4 -24 1 -45" fill="none" stroke="#775635" opacity=".3" stroke-width="2"/></g>`}${t===0&&n>25?flower(308,344,6,'#efb4b0')+flower(181,352,5,'#efb4b0'):''}${t===1?[136,365,390].map((x,i)=>flower(x,330+i*5,5,'#faf9e7')).join(''):''}</svg>`}
function flower(x,y,r,color){return `<g transform="translate(${x} ${y})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="${-r*.6}" rx="${r*.48}" ry="${r*.68}" fill="${color}" transform="rotate(${a})"/>`).join('')}<circle r="${r*.22}" fill="#f2d592"/></g>`}
function choose(){app.innerHTML=`<div class="intro"><div class="eyebrow">A LITTLE CARE, ONE BY ONE</div><h1>从一颗种子开始</h1><p>选一个想抵达的小天地。接下来的30项，写下你的感受，陪它慢慢长大。</p></div><div class="cards">${themes.map((t,i)=>`<button class="seed-card ${i===selected?'selected':''}" data-pick="${i}" aria-pressed="${i===selected}">${treeSvg(i,30,'pick'+i)}<span class="seed">${['◒','◕','◈'][i]} ${t.seed} → 成熟大树</span><h3>${t.name}</h3><p>${t.tag}</p></button>`).join('')}</div><div class="pick-action"><button class="primary" id="plant">种下${themes[selected].seed} &nbsp; ↗</button><p class="subtle">写完一项，立刻打开下一项 · 每5项一个变化 · 30项长成大树</p></div>`;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=+b.dataset.pick;choose()});$('#plant').onclick=()=>{state.tree={theme:selected,started:day(),entries:[],pending:null,lastWater:null};if(save()){editing=false;render()}}}
function panelBody(tr,n,t,c){
  if(n===30){
    return `<div class="eyebrow">THIRTY LITTLE MOMENTS</div><h2>30项感受，一棵大树</h2><p>你写下的每句话，都和这棵树一起留下来了。</p><button class="primary" id="poster">保存大树海报</button><button class="primary" id="again">收进树林，再种一棵</button>`;
  }
  if(editing){
    return `<div class="eyebrow">ITEM ${String(n+1).padStart(2,'0')} · 写感受</div><h2>第 ${String(n+1).padStart(2,'0')} 项 · 写感受</h2><label for="taskInput">这一项（可以改）</label><input id="taskInput" type="text" maxlength="160" value="${esc(tasks[n])}"><label for="noteInput">你的感受</label><textarea id="noteInput" maxlength="2000" placeholder="写下你对这一项的感受……"></textarea><button class="primary" id="finish">写完，打开下一项</button><button class="subtle" id="later">一会再来</button>`;
  }
  return `<div class="eyebrow">ITEM ${String(n+1).padStart(2,'0')} · 写感受</div><h2>第 ${String(n+1).padStart(2,'0')} 项 · 写感受</h2><div class="task">${esc(tasks[n])}</div><p>写完这一项的感受，就会长出一片叶子，并打开下一项。</p><button class="primary" id="do">开始写感受 &nbsp; ↗</button><div style="text-align:center"><button class="subtle" id="later">一会再来</button></div>`;
}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id===screen));if(screen==='notes')return notes();if(screen==='groves')return groves();if(!state.tree&&demo===null)return choose();const tr=state.tree,n=demo?demo.n:tr.entries.length,t=demo?demo.t:tr.theme,c=themes[t];
app.innerHTML=`<div class="garden-layout"><section class="garden"><span class="pill">${demo?'生长预览 · 不写入记录':c.name+' · '+(n===30?'已经长成':n===0?'刚刚种下':'正在生长')}</span><h1>${n===0?'今天，种下一点期待':n===30?'你的小树，长大了':n<6?'慢慢来，正在扎根':'每一点感受，都在生长'}</h1>${treeSvg(t,n,'main',fresh)}<p class="caption">${n===30?c.quote:n===0?'所有的生长，都从这一刻开始。':`第${n}片叶子，是你留下的一个小小脚印。`}</p><div class="stages">${['萌芽','扎根','展枝','成冠','丰盈','长成'].map((s,i)=>`<span class="${n>i*5?'on':''}">${s}<br>${(i+1)*5}项</span>`).join('')}</div></section><section class="panel"><div class="progress-head"><span>${demo?'预览进度':'已写感受'}</span><span>${n} / 30 项</span></div><div class="progress"><i style="width:${n/30*100}%"></i></div>${demo?`<div class="eyebrow">GROWTH PREVIEW</div><h2>看看未来的样子</h2><p>拖动下方进度，看看种子如何变成大树。这里的变化不会影响你的真实记录。</p><button class="primary" id="exitDemo">回到我的树</button>`:panelBody(tr,n,t,c)}</section></div><details class="preview" ${demo?'open':''}><summary>✧ 生长预览 · 提前看看30项的变化</summary><div class="preview-controls">${themes.map((x,i)=>`<button data-demo="${i}" class="${t===i?'on':''}">${x.name}</button>`).join('')}<input id="range" aria-label="预览生长项数" type="range" min="0" max="30" value="${n}"><span id="rangeLabel">${n}项</span></div></details>`;fresh=false;
const bind=(s,f)=>{if($(s))$(s).onclick=f};
bind('#do',()=>{editing=true;render();setTimeout(()=>$('#noteInput')?.focus(),0)});
bind('#later',()=>{editing=false;render();toast('小树在这里，等你有空再来。')});
bind('#finish',()=>{
  const task=$('#taskInput').value.trim(),note=$('#noteInput').value.trim();
  if(!task||!note)return toast('写下这一项和你的感受，再继续。');
  if(tr.entries.length>=30)return;
  tr.entries.push({task,note,date:day(),created:day()});
  tr.pending=null;
  tr.lastWater=day();
  if(save()){
    editing=false;fresh=true;chime();render();
    $('.garden')?.classList.add('watering');
    setTimeout(()=>$('.garden')?.classList.remove('watering'),1600);
    const left=30-tr.entries.length;
    toast(left?`第${tr.entries.length}片叶子长出来了。下一项已打开。`:`第30片叶子长出来了。你的小树长大了。`);
  }
});
bind('#exitDemo',()=>{demo=null;render()});
bind('#again',()=>{state.groves.push({...tr,completed:day()});state.tree=null;if(save()){editing=false;render()}});
bind('#poster',()=>poster(tr));
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{demo={t:+b.dataset.demo,n};render()});
if($('#range')){
  $('#range').oninput=e=>{$('#rangeLabel').textContent=e.target.value+'项';$('.garden svg').outerHTML=treeSvg(t,+e.target.value,'main');};
  $('#range').onchange=e=>{demo={t,n:+e.target.value};render()};
}
}
function entriesHtml(entries,editable){
  return entries.map((e,i)=>{
    if(editable&&editNote===i){
      return `<article class="entry editing" data-idx="${i}"><small>第${String(i+1).padStart(2,'0')}片叶子 · ${esc(e.date)}</small><label for="editTask${i}">这一项</label><input id="editTask${i}" type="text" maxlength="160" value="${esc(e.task)}"><label for="editNote${i}">你的感受</label><textarea id="editNote${i}" maxlength="2000">${esc(e.note)}</textarea><div class="entry-actions"><button class="primary" data-save="${i}">保存</button><button class="subtle" data-cancel-edit="${i}">取消</button></div></article>`;
    }
    return `<article class="entry"><small>第${String(i+1).padStart(2,'0')}片叶子 · ${esc(e.date)}</small><h3>${esc(e.task)}</h3><p>${esc(e.note)}</p>${editable?`<div class="entry-actions"><button class="subtle" data-edit="${i}">编辑</button></div>`:''}</article>`;
  }).join('');
}
function notes(){
  const entries=state.tree?.entries||[];
  app.innerHTML=`<div class="intro"><div class="eyebrow">WORDS TO MYSELF</div><h1>拾言</h1><p>那些写给自己的话，值得被好好收着。已写的可以回来改。</p><button class="subtle" id="exportNotes">↓ 导出这棵树的文字</button></div><div class="entries">${entries.length?entriesHtml(entries,true):'<div class="empty">第一片叶子长出来时，第一句话也会留在这里。</div>'}</div>`;
  $('#exportNotes').onclick=()=>exportNotes(state.tree);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editNote=+b.dataset.edit;notes();setTimeout(()=>$(`#editNote${editNote}`)?.focus(),0)});
  document.querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>{editNote=-1;notes()});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.save;
    const task=$(`#editTask${i}`).value.trim(),note=$(`#editNote${i}`).value.trim();
    if(!task||!note)return toast('项目名和感受都要留下。');
    state.tree.entries[i]={...state.tree.entries[i],task,note};
    if(save()){editNote=-1;notes();toast('已保存修改。')}
  });
}
function exportNotes(tr){if(!tr?.entries.length)return toast('还没有可以导出的记录。');download('神树-拾言.txt',tr.entries.map((e,i)=>`第${i+1}片叶子 · ${e.date}\n${e.task}\n${e.note}`).join('\n\n'),'text/plain')}
function groves(){app.innerHTML=`<div class="intro"><div class="eyebrow">MY LITTLE FOREST</div><h1>我的树林</h1><p>长成的树，和走过的日子，都在这里。</p></div><div class="entries">${state.groves.length?state.groves.map((tr,i)=>`<article class="grove-card">${treeSvg(tr.theme,30,'grove'+i)}<h3>${themes[tr.theme].name}</h3><p>${esc(tr.started)} — ${esc(tr.completed)}</p><button data-read="${i}" class="subtle">回看30句话 ↗</button><button data-poster="${i}" class="subtle">保存海报</button><div style="clear:both"></div></article>`).join(''):'<div class="empty">你的第一棵大树，正在来的路上。</div>'}</div>`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{const tr=state.groves[+b.dataset.read];$('#modal').innerHTML=`<button class="close" aria-label="关闭">×</button><h2>${themes[tr.theme].name}</h2><button id="exportOld" class="subtle">导出文字</button>${entriesHtml(tr.entries,false)}`;$('#modal .close').onclick=()=>$('#modal').close();$('#exportOld').onclick=()=>exportNotes(tr);$('#modal').showModal()});document.querySelectorAll('[data-poster]').forEach(b=>b.onclick=()=>poster(state.groves[+b.dataset.poster]))}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function poster(tr){const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=1824;const ctx=canvas.getContext('2d');ctx.fillStyle='#f3f3e9';ctx.fillRect(0,0,1280,1824);const img=new Image(),url=URL.createObjectURL(new Blob([treeSvg(tr.theme,30,'poster')],{type:'image/svg+xml'}));img.onload=()=>{ctx.drawImage(img,60,270,1160,1000);ctx.textAlign='center';ctx.fillStyle='#34493a';ctx.font='52px serif';ctx.fillText('神树 · 稳稳扎根',640,180);ctx.font='35px serif';ctx.fillText(themes[tr.theme].name,640,1350);ctx.font='25px serif';ctx.fillText(themes[tr.theme].quote,640,1430);ctx.fillStyle='#879181';ctx.font='23px sans-serif';ctx.fillText(`${tr.started} — ${tr.completed||tr.lastWater||''}  ·  30项感受`,640,1570);ctx.fillText('一点一点写感受，慢慢长成自己的样子。',640,1660);canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='神树-'+themes[tr.theme].name+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});URL.revokeObjectURL(url)};img.src=url}
function validTree(t){
  return t&&Number.isInteger(t.theme)&&t.theme>=0&&t.theme<3&&Array.isArray(t.entries)&&t.entries.length<=30&&t.entries.every(e=>typeof e.note==='string'&&typeof e.task==='string'&&typeof e.date==='string')&&(!t.pending||(typeof t.pending.task==='string'&&typeof t.pending.note==='string'));
}
['home','notes','groves'].forEach(id=>$('#'+id).onclick=()=>{screen=id;demo=null;editing=false;editNote=-1;render()});
$('#sound').onclick=()=>{sound=!sound;$('#sound').innerHTML='♫ <span>声音'+(sound?'开':'关')+'</span>';$('#sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');chime()};
$('#backup').onclick=()=>download('神树备份-'+day()+'.json',JSON.stringify(state,null,2),'application/json');
$('#restore').onclick=()=>{const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const x=JSON.parse(await input.files[0].text());if(!Array.isArray(x.groves)||!x.groves.every(validTree)||(x.tree!==null&&!validTree(x.tree)))throw Error();if(!confirm('恢复会替换当前浏览器的养树记录。建议先备份当前记录。确定恢复？'))return;state=x;if(save()){screen='home';demo=null;editing=false;editNote=-1;render();toast('记录已恢复。')}}catch(e){toast('无法读取这个备份，请选择神树导出的 JSON 文件。')}};input.click()};
render();

</script>
</body>
</html>
